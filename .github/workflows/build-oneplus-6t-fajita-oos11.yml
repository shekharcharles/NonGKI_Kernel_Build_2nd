name: Build OnePlus 6T (fajita OOS11 sdm845 4.9) ReSukiSU+SUSFS

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_6t"
  DEVICE_CODENAME : "fajita"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  # Clean stock OxygenOS-11 source (no KSU) -> framework integrates ReSukiSU fresh
  KERNEL_SOURCE : "https://github.com/OnePlusOSS/android_kernel_oneplus_sdm845.git"
  KERNEL_BRANCH : "oneplus/SDM845_R_11.0"

  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: "https://raw.githubusercontent.com/reocat/android_kernel_oneplus6/development/arch/arm64/configs/enchilada_defconfig"
  DEFCONFIG_NAME : "enchilada_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # matches device's current root family (com.resukisu.resukisu)

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oos11"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "op_kernel"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"

  HOOK_METHOD: "syscall" # proven on sdm845 4.9 (polaris)

  KERNEL_PATCH: "true" # 4.9 -> patch kernel_write/kernel_read functions

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true" # surface build errors while adapting
  SKIP_PATCH: "true" # ignore 2 SUS_KSTAT rej hunks (OnePlus fs drift); rest of susfs applies

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: OnePlus 6T (fajita OOS11)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⌛️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🩹 Revert partial-susfs stat.c (BEFORE hooks land on it)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Partial-susfs files (hunks skipped by SKIP_PATCH / not fitting OnePlus fs) broke compile.
          # Revert to pristine BEFORE hooks so ReSukiSU inline hooks land clean. Loses only 2 secondary
          # sus features (kstat stat spoof, inotify-fdinfo hiding); core SUS_PATH/MOUNT/MAPS intact.
          git checkout -- fs/stat.c fs/notify/fdinfo.c fs/proc/cmdline.c fs/proc/base.c && echo "[+] reverted partial-susfs secondary files to pristine before hooks"

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options (OnePlus 4.9 + modern clang fixes)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # (stack-protector handled via config disable below — the Makefile ifdef hack caused
          #  __stack_chk_guard/fail undefined symbols with enchilada's STACKPROTECTOR_STRONG=y)
          # OnePlus gcc-wrapper breaks clang; neutralize if referenced
          if grep -q "gcc-wrapper" Makefile 2>/dev/null; then
            sed -i 's#scripts/gcc-wrapper.py##g' Makefile && echo "[+] gcc-wrapper neutralized"
          fi
          # clang rejects GCC-only warning flags under -Werror: strip -Wno-undefined-optimized + tolerate unknown -W
          grep -rl -- '-Wno-undefined-optimized' . 2>/dev/null | xargs -r sed -i 's/-Wno-undefined-optimized//g'
          sed -i 's|^KBUILD_CFLAGS :=|KBUILD_CFLAGS := -Wno-unknown-warning-option |' Makefile
          echo "[+] clang warning-flag fixes applied"
          # ld.lld can't infer target on empty built-in.o. LD=ld.lld is command-line-set (overrides Makefile LD+=),
          # so put emulation in LDFLAGS (not command-line-set) -> reaches the empty-link ld_flags.
          printf '\nLDFLAGS += -maarch64linux\n' >> arch/arm64/Makefile
          echo "[+] ld.lld emulation via LDFLAGS:"; grep -n 'maarch64linux' arch/arm64/Makefile | head -2
          # Drop the ENTIRE Qualcomm reference-board sdm845 dtb-y block (sim/rumi/mtp/cdp/qrd/qvr/robotics/interposer)
          # — none are OnePlus; several have undefined-label bugs. Fajita DT comes from sdm845.dtb base + fajita overlays.
          sed -i '/sdm845-sim\.dtb/,/sdm845-v2\.1-mtp\.dtb$/d' arch/arm64/boot/dts/qcom/Makefile
          echo "[+] removed reference-board sdm845 dtb-y block (remaining sim refs: $(grep -c 'sdm845-sim.dtb' arch/arm64/boot/dts/qcom/Makefile || echo 0))"
          # ld.lld PIE-reloc emitted a kernel that boots but init SIGSEGVs. Build NON-relocatable (fixed address)
          # -> skips the whole -pie/-shared LDFLAGS_vmlinux block, no lld reloc issue. Loses KASLR only.
          DC=arch/arm64/configs/enchilada_defconfig
          printf '# CONFIG_RANDOMIZE_BASE is not set\n# CONFIG_RELOCATABLE is not set\n' >> $DC
          echo "[+] disabled CONFIG_RELOCATABLE + RANDOMIZE_BASE (non-PIE kernel)"
          # enchilada enables DT_OVERLAY -> DTC '-@' flag which 4.9 bundled dtc lacks ("unknown option").
          # We use stock kernel_dtb for boot, don't need built overlays -> disable overlay build.
          printf '# CONFIG_BUILD_ARM64_DT_OVERLAY is not set\n' >> $DC
          echo "[+] disabled CONFIG_BUILD_ARM64_DT_OVERLAY (dtc -@ unsupported on 4.9)"
          # Fully disable stack protector (STRONG cc-option misfires under clang -> __stack_chk_guard/fail undefined).
          printf '# CONFIG_CC_STACKPROTECTOR_REGULAR is not set\n# CONFIG_CC_STACKPROTECTOR_STRONG is not set\nCONFIG_CC_STACKPROTECTOR_NONE=y\n' >> $DC
          echo "[+] disabled stack protector (NONE)"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
